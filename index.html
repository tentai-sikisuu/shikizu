<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0D0D1A">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="天体色数図">
<title>天体色数® 天体色数図</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--deep:#0D0D1A;--panel:#0f1030;--soft:#F5F0E8;--accent:#E8D5A3;
  --serif:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--deep);color:var(--soft);font-family:var(--serif);min-height:100vh;min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
[hidden]{display:none!important;}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite;opacity:var(--o,.5);}
@keyframes twinkle{0%,100%{opacity:var(--o,.5);}50%{opacity:1;}}
@media (prefers-reduced-motion:reduce){.star{animation:none;}}

/* ===== 入力画面 ===== */
#form-view{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:36px 18px 40px;}
header{text-align:center;margin-bottom:26px;}
.title-en{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:5px;color:var(--gold);margin-bottom:8px;}
h1{font-family:'Cormorant Garamond',var(--serif);font-size:32px;font-weight:300;color:var(--accent);letter-spacing:3px;}
h1 sup{font-size:13px;}
.subtitle{font-size:13px;color:rgba(245,240,232,.6);letter-spacing:3px;margin-top:4px;}
.card{background:rgba(20,20,40,.88);border:1px solid rgba(201,168,76,.25);border-radius:4px;padding:22px 18px;}
.field{margin-bottom:20px;}
label{display:block;font-size:13px;letter-spacing:1px;color:rgba(245,240,232,.85);margin-bottom:8px;}
label small{font-size:11px;color:var(--gold);margin-left:6px;letter-spacing:0;}
input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(201,168,76,.35);border-radius:4px;color:var(--soft);
  font-family:var(--serif);font-size:16px;/* 16px未満だとiPhoneで勝手にズームする */padding:12px 12px;outline:none;-webkit-appearance:none;appearance:none;}
input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,168,76,.25);}
input::placeholder{color:rgba(245,240,232,.3);}
.date-row{display:flex;gap:6px;align-items:center;}
.date-row input{text-align:center;padding:12px 4px;}
.date-row span{font-size:13px;color:rgba(245,240,232,.6);}
#birth-year{flex:2.2;} #birth-month,#birth-day{flex:1;}
#birth-time{text-align:center;letter-spacing:2px;}
.hint{font-size:12px;margin-top:6px;line-height:1.6;color:rgba(245,240,232,.5);}
.hint.ok{color:#8fd19e;} .hint.warn{color:#e8c46a;}
.btn{width:100%;padding:16px;margin-top:6px;background:var(--gold);border:none;border-radius:4px;color:#14141f;
  font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:2px;cursor:pointer;}
.btn:active{opacity:.8;}
.error-msg{display:none;margin-top:14px;padding:10px 12px;border:1px solid rgba(230,57,70,.6);background:rgba(230,57,70,.12);
  border-radius:4px;font-size:13px;line-height:1.6;color:#ffb3b8;}

/* ===== 結果画面：スマホ1画面に収める ===== */
#result-view{position:relative;z-index:1;}
.sheet{--chart:min(96vw,calc(100svh - 196px),520px);
  min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 2vw 8px;gap:6px;}
@supports not (height:100svh){.sheet{--chart:min(96vw,calc(100vh - 250px),520px);}}
.sheet-title{font-size:14px;letter-spacing:3px;color:var(--gold);}
.top-row{width:var(--chart);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;}
.badge{border:1px solid var(--gold);background:var(--panel);border-radius:3px;padding:6px 6px 7px;min-width:0;}
.badge-label{font-size:10px;letter-spacing:1px;color:var(--gold);text-align:center;margin-bottom:4px;white-space:nowrap;}
.badge-body{display:flex;align-items:center;justify-content:center;gap:7px;}
.badge-dot{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.35);}
.badge-text{min-width:0;line-height:1.25;}
.badge-color{font-size:13px;font-weight:600;white-space:nowrap;}
.badge-sign{font-size:10px;color:rgba(245,240,232,.6);white-space:nowrap;}
.unmei{text-align:center;padding:0 4px;}
.unmei-label{font-size:10px;letter-spacing:1px;color:rgba(245,240,232,.65);white-space:nowrap;}
.unmei-num{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:46px;line-height:1;color:var(--accent);}
#celestial-chart{width:var(--chart);height:var(--chart);}
.chart-svg{width:100%;height:100%;display:block;border-radius:4px;}
.badge.total{width:min(200px,50vw);}
.calc-info{font-size:11px;color:rgba(245,240,232,.45);text-align:center;letter-spacing:.5px;}

.after{max-width:480px;margin:0 auto;padding:4px 18px 32px;}
.notes{display:none;margin-bottom:14px;font-size:12px;line-height:1.7;color:#e8c46a;}
.notes p+p{margin-top:6px;}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.actions .wide{grid-column:1/-1;}
.sub-btn{padding:14px 8px;background:transparent;border:1px solid rgba(201,168,76,.6);border-radius:4px;color:var(--gold);
  font-family:var(--serif);font-size:14px;letter-spacing:1px;cursor:pointer;}
.sub-btn:disabled{opacity:.5;}
.pdf-label{font-size:12px;letter-spacing:2px;color:var(--gold);text-align:center;margin-bottom:-2px;}
.pdf-pick{display:flex;align-items:center;justify-content:center;gap:8px;}
.pdf-chip{width:16px;height:16px;border-radius:50%;flex:none;border:1px solid var(--gold);}
.pdf-chip.navy{background:#0d0d3b;} .pdf-chip.white{background:#fff;}

@media (min-width:600px){.sheet{--chart:min(calc(100svh - 210px),520px);}}

/* ===== 印刷：天体色数図だけ ===== */
@media print{
  @page{size:A4 portrait;margin:0;}
  html,body{width:210mm;height:auto!important;min-height:0!important;margin:0!important;padding:0!important;
    background:#07071a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;overflow:hidden;}
  .stars,#form-view,.after,.inapp-note{display:none!important;}
  #result-view{height:auto;}
  .sheet{--chart:145mm;width:100%;height:272mm;min-height:0!important;max-height:272mm;overflow:hidden;
    box-sizing:border-box;padding:14mm 0 10mm;gap:4mm;justify-content:center;
    background:radial-gradient(ellipse 62% 48% at 50% 50%,#1a1a5e 0%,#0d0d3b 55%,#07071a 100%);
    page-break-after:avoid;break-after:avoid;page-break-inside:avoid;break-inside:avoid;}
  .badge-label{font-size:11pt;} .badge-color{font-size:14pt;} .badge-sign{font-size:10pt;} .badge-dot{width:32px;height:32px;}
  .unmei-label{font-size:10pt;} .unmei-num{font-size:60pt;} .sheet-title{font-size:14pt;} .calc-info{font-size:9pt;}
  /* ネイビー版：天体色数図の四角い背景をなくし、ページ背景とつなげる */
  #celestial-chart rect{fill:transparent;}
  /* 白背景版：金の文字・線を少し太く・濃く */
  html.print-white,html.print-white body,html.print-white .sheet{background:#fff!important;}
  html.print-white .sheet-title{color:#8B6914;font-weight:600;}
  html.print-white .badge{background:#fff;border:1.5px solid #9C7A2C;}
  html.print-white .badge-label{color:#8B6914;font-weight:600;}
  html.print-white .badge-color{color:#1a1a1a;}
  html.print-white .badge-sign{color:#555;}
  html.print-white .badge-dot{border-color:rgba(0,0,0,.2);}
  html.print-white .unmei-label{color:#555;font-weight:600;}
  html.print-white .unmei-num{color:#8B6914;font-weight:400;}
  html.print-white .calc-info{color:#555;}
}
.inapp-note{position:relative;z-index:2;max-width:480px;margin:12px auto 0;padding:10px 14px;border:1px solid #e8c46a;border-radius:4px;
  background:rgba(232,196,106,.12);color:#f3dc9a;font-size:12px;line-height:1.7;}

/* ===== オフライン保存・バージョン表示・更新のお知らせ ===== */
.dl-box{margin:22px auto 0;position:relative;z-index:1;}
.dl-btn{width:100%;padding:13px;background:transparent;border:1px solid rgba(201,168,76,.6);border-radius:4px;color:#C9A84C;
  font-family:'Noto Serif JP',serif;font-size:14px;letter-spacing:2px;cursor:pointer;}
.dl-btn:disabled{opacity:.5;}
.dl-note{font-size:11px;color:rgba(245,240,232,.45);margin-top:8px;text-align:center;line-height:1.7;}
.dl-ver{letter-spacing:1px;}
.update-bar{position:relative;z-index:5;max-width:480px;margin:12px auto 0;padding:12px 14px;border:1px solid #C9A84C;border-radius:4px;
  background:rgba(201,168,76,.12);color:#F5F0E8;font-size:12.5px;line-height:1.8;text-align:center;}
.update-bar b{color:#E8D5A3;font-weight:600;}
.update-bar a{display:inline-block;margin-top:6px;padding:7px 16px;border:1px solid #C9A84C;border-radius:4px;color:#C9A84C;text-decoration:none;letter-spacing:1px;}
@media print{.dl-box,.update-bar{display:none !important;}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="inapp-note" id="inapp-note" hidden>LINEやインスタのアプリ内で開いているため、PDF保存・印刷がうまく動かないことがあります。右上のメニューから「ブラウザで開く」（iPhoneはSafari、AndroidはChrome）で開いてください。</div>
<main id="form-view">
  <header>
    <div class="title-en">Celestial Color Number</div>
    <h1>天体色数<sup>®</sup></h1>
    <div class="subtitle">天体色数図 自動計算</div>
  </header>
  <div class="card">
    <div class="field">
      <label for="clientname">お名前 <small>任意</small></label>
      <input type="text" id="clientname" placeholder="例：田中 花子" autocomplete="off">
    </div>
    <div class="field">
      <label for="birth-year">生年月日 <small>※半角数字で入力</small></label>
      <div class="date-row">
        <input type="text" id="birth-year" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1985" aria-label="年">
        <span>年</span>
        <input type="text" id="birth-month" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="03" aria-label="月">
        <span>月</span>
        <input type="text" id="birth-day" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="15" aria-label="日">
        <span>日</span>
      </div>
    </div>
    <div class="field">
      <label for="birth-time">出生時刻 <small>わかれば</small></label>
      <input type="text" id="birth-time" inputmode="numeric" maxlength="5" placeholder="06:40" autocomplete="off">
      <div class="hint">数字4ケタでOK（0640 → 06:40）。わからない場合は空欄（12時で計算します）</div>
    </div>
    <div class="field">
      <label for="birth-place">出生地 <small>※市・郡まで入力</small></label>
      <input type="text" id="birth-place" placeholder="例：大阪府大阪市" autocomplete="off">
      <div class="hint" id="place-hint"></div>
    </div>
    <button class="btn" type="button" onclick="run()">天体色数図を出す</button>
    <div id="error-msg" class="error-msg" role="alert"></div>
  </div>
<div class="dl-box" id="dl-box"><button class="dl-btn" id="dl-btn" type="button" onclick="downloadTool()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>&nbsp;パソコンに保存（オフライン用）</button><div class="dl-note"><span id="dl-desc">ネット環境がない場所で使うときは、保存したファイルを開いてください<br></span><span class="dl-ver" id="dl-ver"></span></div></div>
</main>

<div id="result-view" hidden>
  <section class="sheet" id="sheet">
    <div class="sheet-title" id="result-title">天体色数図</div>
    <div class="top-row">
      <div class="badge">
        <div class="badge-label">男性色数</div>
        <div class="badge-body"><div class="badge-dot" id="male-dot"></div>
          <div class="badge-text"><div class="badge-color" id="male-color">—</div><div class="badge-sign" id="male-sign"></div></div></div>
      </div>
      <div class="unmei">
        <div class="unmei-label">運命数（誕生数）</div>
        <div class="unmei-num" id="unmei-display">—</div>
      </div>
      <div class="badge">
        <div class="badge-label">女性色数</div>
        <div class="badge-body"><div class="badge-dot" id="female-dot"></div>
          <div class="badge-text"><div class="badge-color" id="female-color">—</div><div class="badge-sign" id="female-sign"></div></div></div>
      </div>
    </div>
    <div id="celestial-chart"></div>
    <div class="badge total">
      <div class="badge-label">統合色数</div>
      <div class="badge-body"><div class="badge-dot" id="total-dot"></div>
        <div class="badge-text"><div class="badge-color" id="total-color">—</div><div class="badge-sign" id="total-sign"></div></div></div>
    </div>
    <div class="calc-info" id="calc-info"></div>
  </section>
  <div class="after">
    <div class="notes" id="calc-notes"></div>
    <div class="actions">
      <div class="pdf-label wide">PDF保存・印刷（背景を選択）</div>
      <button class="sub-btn pdf-pick" type="button" onclick="savePDF('navy')"><span class="pdf-chip navy"></span>ネイビー背景</button>
      <button class="sub-btn pdf-pick" type="button" onclick="savePDF('white')"><span class="pdf-chip white"></span>白背景</button>
      <button class="sub-btn wide" type="button" onclick="reset()">別の人を出す</button>
    </div>
  </div>
</div>

function normText(s){
  return (s||'').normalize('NFKC').replace(/\s+/g,'').replace(/ケ/g,'ヶ').replace(/[ヵ]/g,'ヶ');
}
const PREF_NAMES=Object.keys(JP_DB);
const PREF_INDEX={};
PREF_NAMES.forEach(p=>{
  PREF_INDEX[p]=JP_DB[p].m.split(';').map(r=>{const a=r.split(',');return {name:a[0],lat:+a[1],lon:+a[2]};});
});
function prefShort(p){ return p==='北海道'?p:p.replace(/[都府県]$/,''); }

// 市区町村名から一番長く一致するものを探す
function matchCity(pref, rest){
  if(!rest) return null;
  const list=PREF_INDEX[pref]; let best=null, bestLen=0;
  list.forEach(e=>{
    const n=normText(e.name);
    // 郡を省略した入力（例：府中町）にも対応
    const noGun=n.replace(/^.+?郡/,'');
    const short=n.replace(/[市区町村郡]$/,'');
    [[n,3],[noGun,2],[short,1]].forEach(([cand,w])=>{
      if(cand.length>=2 && rest.startsWith(cand)){
        const score=cand.length*10+w;
        if(score>bestLen){bestLen=score;best=e;}
      }
    });
  });
  return best;
}

function findPlace(input){
  const s=normText(input);
  if(!s) return null;
  const lower=s.toLowerCase();
  // 海外
  for(const c of WORLD_CITIES){
    if(c.k.some(k=>lower.includes(k.replace(/\s+/g,'')))) return {lat:c.lat,lon:c.lon,tz:c.tz,label:input.trim(),japan:false,level:'city'};
  }
  // 都道府県から
  for(const p of PREF_NAMES){
    for(const head of [p,prefShort(p)]){
      if(s.startsWith(head)){
        const rest=s.slice(head.length);
        const c=matchCity(p,rest);
        if(c) return {lat:c.lat,lon:c.lon,tz:9,label:p+c.name,japan:true,level:'city'};
        if(head===p || !rest) return {lat:JP_DB[p].c[0],lon:JP_DB[p].c[1],tz:9,label:p,japan:true,level:'pref'};
      }
    }
  }
  // 都道府県なし → 全国から市区町村名で
  let best=null,bestScore=0;
  for(const p of PREF_NAMES){
    const c=matchCity(p,s);
    if(c){
      const sc=normText(c.name).length;
      if(sc>bestScore){bestScore=sc;best={lat:c.lat,lon:c.lon,tz:9,label:p+c.name,japan:true,level:'city'};}
    }
  }
  return best;
}

// 日本のサマータイム（1948〜1951年）
function japanDST(y,m,d,h){
  const P={1948:[[5,2],[9,12]],1949:[[4,3],[9,11]],1950:[[5,7],[9,10]],1951:[[5,6],[9,9]]};
  if(!P[y]) return false;
  const v=m*100+d, s=P[y][0][0]*100+P[y][0][1], e=P[y][1][0]*100+P[y][1][1];
  return v>=s && (v<e || (v===e && h<1));
}

// ===== 天体計算 =====
function calcPlanets(year,month,day,hour,minute,tzOffset){
  const date=new Date(Date.UTC(year,month-1,day,hour,minute)-tzOffset*3600000);
  const A=window.Astronomy, out={};
  PLANETS.forEach(k=>{
    let lon;
    if(k==='Sun') lon=A.SunPosition(date).elon;
    else if(k==='Moon') lon=A.EclipticGeoMoon(date).lon;
    else lon=A.Ecliptic(A.GeoVector(A.Body[k],date,true)).elon;
    out[k]=lonToSign(lon);
  });
  return out;
}

  let sum=dateStr.replace(/-/g,'').split('').map(Number).reduce((a,b)=>a+b,0);
  const isMaster=n=>[11,22,33,44].includes(n);
  while(!(isMaster(sum)||sum<=12)) sum=sum.toString().split('').map(Number).reduce((a,b)=>a+b,0);
  return sum;
}
function reduceColorNum(n){ while(n>12) n=n.toString().split('').map(Number).reduce((a,b)=>a+b,0); return n; }
function getSupportNum(u){ return u===22?10:u===33?9:u===44?8:u; }

function computeChart(birthdate, planets){
  const unmei=calcUnmei(birthdate);
  const moonIdx=OUTER_RING_CW.findIndex(o=>o.sign===planets.Moon);
  const startIdx=(moonIdx+(unmei-1))%12;
  const mapping=[];
  for(let i=0;i<12;i++) mapping.push({num:i+1,...OUTER_RING_CW[(startIdx+i)%12]});
  const supportNum=getSupportNum(unmei);
  const numOf=sign=>(mapping.find(m=>m.sign===sign)||{num:0}).num;
  const n={}; PLANETS.forEach(k=>n[k]=numOf(planets[k]));
  const fo={Mars:numOf('Pisces'),Jupiter:numOf('Scorpio'),Saturn:numOf('Capricorn'),Mercury:numOf('Virgo'),Moon:numOf('Taurus'),Venus:numOf('Cancer')};
  const sum=a=>reduceColorNum(a.reduce((x,y)=>x+y,0));
  const male  =sum([fo.Mars,   n.Mars,   n.Sun,n.Venus,  fo.Mercury]);
  const female=sum([fo.Jupiter,n.Jupiter,n.Sun,n.Mercury,fo.Moon]);
  const total =sum([fo.Saturn, n.Saturn, n.Sun,n.Moon,   fo.Venus]);
  const info=x=>mapping.find(m=>m.num===x)||{color:'—',hex:'#888',ja:'—'};
  return {unmei,mapping,supportNum,male:info(male),female:info(female),total:info(total)};
}

// ===== 天体色数図SVG =====
function buildChart(planets, mapping, supportNum){
  const RING=[
    {sign:'Capricorn',ja:'やぎ',hex:'#1A237E'},{sign:'Sagittarius',ja:'いて',hex:'#4A90D9'},
    {sign:'Scorpio',ja:'さそり',hex:'#2CBFBF'},{sign:'Libra',ja:'てんびん',hex:'#4CAF50'},
    {sign:'Virgo',ja:'おとめ',hex:'#8B9A1A'},{sign:'Leo',ja:'しし',hex:'#FFE83F'},
    {sign:'Cancer',ja:'かに',hex:'#fa7331'},{sign:'Gemini',ja:'ふたご',hex:'#FF9F1C'},
    {sign:'Taurus',ja:'おうし',hex:'#ee9f8a'},{sign:'Aries',ja:'おひつじ',hex:'#E63946'},
    {sign:'Pisces',ja:'うお',hex:'#E91E8C'},{sign:'Aquarius',ja:'みずがめ',hex:'#9C27B0'},
  ];
  const OUTWARD=['Taurus','Cancer','Virgo','Scorpio','Capricorn','Pisces'];
  const W=500,H=500,cx=250,cy=250,R=174,r=45,ir=2*r;
  const ringPos=i=>{const a=(270+i*30)*Math.PI/180;return {x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)};};
  const innerPos=i=>{const a=(270+i*60)*Math.PI/180;return {x:cx+ir*Math.cos(a),y:cy+ir*Math.sin(a)};};
  const getMapNum=sign=>{const m=mapping.find(m=>m.sign===sign);return m?m.num:null;};
  const ORDER=['Saturn','Jupiter','Venus','Moon','Mercury','Mars'];
  const JA={Sun:'太陽',Moon:'月',Mercury:'水星',Venus:'金星',Mars:'火星',Jupiter:'木星',Saturn:'土星'};
  const PP={}; ORDER.forEach((k,i)=>PP[k]=innerPos(i)); PP.Sun={x:cx,y:cy};
  const f=v=>v.toFixed(1);

  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 12 476 476" width="464" height="464" class="chart-svg" role="img" aria-label="天体色数図">
  <defs><radialGradient id="bgGrad" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#1a1a5e"/><stop offset="60%" stop-color="#0d0d3b"/><stop offset="100%" stop-color="#05050f"/></radialGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#bgGrad)"/>`;
  let sx=0.7141,sy=0.3731;
  for(let i=0;i<120;i++){
    sx=(sx*7.42+0.321)%1; sy=(sy*5.83+0.147)%1;
    const pr=0.3+((i*73)%100)/100*1.8, op=0.2+((i*37)%100)/100*0.7;
    svg+=`<circle cx="${f(sx*W)}" cy="${f(sy*H)}" r="${pr}" fill="white" opacity="${op.toFixed(2)}"/>`;
  }
  // ===== 天体色数図（協会の図に準拠：メタトロンキューブ入り） =====
  // 全19円が同じ大きさ。色の面はぴったり接し、縁の線だけ重なる配置。
  //  内側7天体：太陽＋6天体（中心から2r）
  //  外周12星座：12・2・4・6・8・10時 → 中心から4r（太枠）
  //              1・3・5・7・9・11時 → 内側6円に接する位置（√3×2r）
  {
    const C=250, CR=46, CIR=2*CR, CRE=4*CR, CRO=Math.sqrt(3)*CIR;
    const fx=v=>v.toFixed(1);
    const rPos=i=>{const a=(270+i*30)*Math.PI/180, d=(i%2)?CRO:CRE; return {x:C+d*Math.cos(a), y:C+d*Math.sin(a)};};
    const iPos=i=>{const a=(270+i*60)*Math.PI/180; return {x:C+CIR*Math.cos(a), y:C+CIR*Math.sin(a)};};
    const PORDER=['Saturn','Jupiter','Venus','Moon','Mercury','Mars'];
    const PJA={Sun:'太陽',Moon:'月',Mercury:'水星',Venus:'金星',Mars:'火星',Jupiter:'木星',Saturn:'土星'};
    const PPOS={}; PORDER.forEach((k,i)=>PPOS[k]=iPos(i)); PPOS.Sun={x:C,y:C};

    // 外周のゴールドサークル
    svg+=`<circle cx="${C}" cy="${C}" r="${CRE+CR+1}" fill="none" stroke="#C9A84C" stroke-width="0.75" opacity="0.8"/>`;

    // メタトロンキューブ：太陽＋内側6天体＋外周6か所（12・2・4・6・8・10時）の13点をすべて結ぶ
    // 円のうしろに描くので、円と円のすき間からだけ線がのぞく
    const nodes=[PPOS.Sun, ...PORDER.map(k=>PPOS[k]), ...[0,2,4,6,8,10].map(rPos)];
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i], b=nodes[j];
      svg+=`<line x1="${fx(a.x)}" y1="${fx(a.y)}" x2="${fx(b.x)}" y2="${fx(b.y)}" stroke="#D9B85C" stroke-width="0.75"/>`;
    }

    let cOdd='', cEven='', txt='';
    // 外周12星座
    RING.forEach((s,i)=>{
      const p=rPos(i), num=getMapNum(s.sign), sup=num===supportNum, thick=(i%2===0);
      const c=`<circle cx="${fx(p.x)}" cy="${fx(p.y)}" r="${CR}" fill="${s.hex}" stroke="rgba(255,255,255,0.9)" stroke-width="${thick?2:1}"/>`;
      if(thick) cEven+=c; else cOdd+=c;
      if(sup) cEven+=`<circle cx="${fx(p.x)}" cy="${fx(p.y)}" r="${CR+5}" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="4,2"/>`;
      if(num) txt+=`<text x="${fx(p.x)}" y="${fx(p.y-7)}" text-anchor="middle" fill="white" font-size="15" font-weight="bold" font-family="serif">${num}${sup?'★':''}</text>`;
      txt+=`<text x="${fx(p.x)}" y="${fx(p.y+12)}" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">${s.ja}</text>`;
    });
    // 内側7天体（その人の星座の色）
    Object.entries(PPOS).forEach(([k,p])=>{
      const si=RING.find(x=>x.sign===planets[k])||{hex:'#444'};
      cEven+=`<circle cx="${fx(p.x)}" cy="${fx(p.y)}" r="${CR}" fill="${si.hex}" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>`;
      txt+=`<text x="${fx(p.x)}" y="${fx(p.y-6)}" text-anchor="middle" fill="white" font-size="11" font-weight="bold" font-family="sans-serif">${PJA[k]}</text>`;
      txt+=`<text x="${fx(p.x)}" y="${fx(p.y+12)}" text-anchor="middle" fill="white" font-size="12" font-family="serif">${getMapNum(planets[k])||''}</text>`;
    });
    svg+=cOdd+cEven+txt;
  }
  return svg+'</svg>';
}

// ===== 入力まわり =====
const $=id=>document.getElementById(id);
function toHalf(el){
  const v=el.value.normalize('NFKC').replace(/[^0-9]/g,'');
  if(v!==el.value) el.value=v;
}
const pad2=el=>{ if(el.value.length===1) el.value='0'+el.value; };
// 年(4ケタ) → 月(2ケタ) → 日(2ケタ) → 時刻 → 出生地 へ自動で進む
const ORDER_IDS=['birth-year','birth-month','birth-day','birth-time','birth-place'];
const next=id=>{ const n=$(ORDER_IDS[ORDER_IDS.indexOf(id)+1]); n.focus(); if(n.select) n.select(); };
$('birth-year').addEventListener('input',e=>{ toHalf(e.target); if(e.target.value.length>=4) next('birth-year'); });
$('birth-month').addEventListener('input',e=>{
  const el=e.target; toHalf(el);
  if(el.value.length===1 && +el.value>=2) el.value='0'+el.value; // 2〜9はそのまま確定
  if(el.value.length>=2) next('birth-month');
});
$('birth-day').addEventListener('input',e=>{
  const el=e.target; toHalf(el);
  if(el.value.length===1 && +el.value>=4) el.value='0'+el.value; // 4〜9はそのまま確定
  if(el.value.length>=2) next('birth-day');
});
['birth-month','birth-day'].forEach(id=>$(id).addEventListener('blur',e=>pad2(e.target)));

// 時刻：数字だけ打てば「:」を自動で入れる（0640 → 06:40）
$('birth-time').addEventListener('input',e=>{
  const el=e.target;
  let v=el.value.normalize('NFKC').replace(/[^0-9]/g,'').slice(0,4);
  if(v.length===1 && +v>=3) v='0'+v;               // 3〜9時は 0 を補う
  if(v.length>=3) v=v.slice(0,2)+':'+v.slice(2);
  else if(v.length===2 && !(e.inputType||'').startsWith('delete')) v=v+':';
  el.value=v;
  if(v.length===5) next('birth-time');
});
$('birth-time').addEventListener('blur',e=>{
  const el=e.target, v=el.value.replace(/[^0-9]/g,'');
  if(v.length===2) el.value=v+':00';
  else if(v.length===3) el.value='0'+v[0]+':'+v.slice(1);
});

function updatePlaceHint(){
  const v=$('birth-place').value.trim(), h=$('place-hint');
  if(!v){h.textContent='';h.className='hint';return;}
  const g=findPlace(v);
  if(!g){h.textContent='見つかりません。都道府県から入力してください（例：大阪府大阪市）';h.className='hint warn';}
  else if(g.level==='pref'){h.textContent='✓ '+g.label+'（市・郡まで入れるとより正確です）';h.className='hint warn';}
  else {h.textContent='✓ '+g.label+' として計算します';h.className='hint ok';}
}
$('birth-place').addEventListener('input',updatePlaceHint);

function showError(msg){ const e=$('error-msg'); e.textContent=msg; e.style.display='block'; }

function run(){
  $('error-msg').style.display='none';
  const y=+$('birth-year').value, m=+$('birth-month').value, d=+$('birth-day').value;
  const dt=new Date(y,m-1,d);
  if(!y||!m||!d||y<1900||y>2100||dt.getMonth()!==m-1||dt.getDate()!==d){
    showError('生年月日を半角数字で正しく入力してください（例：1985 / 3 / 15）');return;
  }
  const placeRaw=$('birth-place').value.trim();
  if(!placeRaw){showError('出生地を入力してください（例：大阪府大阪市）');return;}
  let geo=findPlace(placeRaw), placeNote='';
  if(!geo){ geo={lat:35,lon:135,tz:9,label:placeRaw,japan:true}; placeNote='※出生地が見つからなかったため、日本時間で計算しています'; }

  const tRaw=$('birth-time').value.trim(), timeKnown=!!tRaw;
  if(timeKnown){
    const mt=tRaw.match(/^(\d{1,2}):(\d{2})$/);
    if(!mt||+mt[1]>23||+mt[2]>59){showError('出生時刻は 06:40 のように入力してください（24時間表記）');return;}
  }
  let hour=12,minute=0;
  if(timeKnown){const t=tRaw.split(':');hour=+t[0];minute=+(t[1]||0);}

  let tz=geo.tz;
  if(geo.japan && japanDST(y,m,d,hour)) tz=10;

  const planets=calcPlanets(y,m,d,hour,minute,tz);
  const birthdate=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const res=computeChart(birthdate,planets);

  // 時刻不明で月星座が切り替わる日かチェック
  let moonNote='';
  if(!timeKnown){
    const a=calcPlanets(y,m,d,0,0,tz).Moon, b=calcPlanets(y,m,d,23,59,tz).Moon;
    if(a!==b){
      let sw=0; for(let h=0;h<24;h++){ if(calcPlanets(y,m,d,h,59,tz).Moon!==a){sw=h;break;} }
      const ja=s=>OUTER_RING_CW.find(o=>o.sign===s).ja;
      moonNote=`⚠ この日は${sw}時台に月星座が${ja(a)}→${ja(b)}へ切り替わります。出生時刻を入れると正確になります（今は12時で計算）`;
    }
  }

  const name=$('clientname').value.trim();
  $('result-title').textContent=name?`${name} 様の天体色数図`:'天体色数図';
  $('unmei-display').textContent=res.unmei;
  $('celestial-chart')._navy=null;
  $('celestial-chart').innerHTML=buildChart(planets,res.mapping,res.supportNum);
  setBadge('male',res.male); setBadge('female',res.female); setBadge('total',res.total);

  const tzTxt=tz===9?'':`（UTC${tz>=0?'+':''}${tz}${tz===10&&geo.japan?' サマータイム':''}）`;
  $('calc-info').textContent=`${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')} ${timeKnown?tRaw:'時刻不明'} ／ ${geo.label}${tzTxt}`;
  const notes=[moonNote,placeNote].filter(Boolean);
  $('calc-notes').innerHTML=notes.map(t=>`<p>${t}</p>`).join('');
  $('calc-notes').style.display=notes.length?'block':'none';

  window._last={name,res,planets};
  $('form-view').hidden=true; $('result-view').hidden=false;
  window.scrollTo(0,0);
}
function setBadge(p,info){
  $(p+'-dot').style.background=info.hex;
  $(p+'-color').textContent=info.color;
  $(p+'-sign').textContent=info.ja;
}
function reset(){ $('result-view').hidden=true; $('form-view').hidden=false; window.scrollTo(0,0); }

// ===== 白背景PDF用：天体色数図をインク節約の白背景版に変換 =====
var PRINT_GOLD = '#9C7A2C';
function whitenChartSvg(html){
  var box = document.createElement('div'); box.innerHTML = html;
  var svg = box.querySelector('svg'); if(!svg) return html;
  var norm = function(v){ return (v||'').toLowerCase().replace(/\s/g,''); };
  var isWhite = function(v){ v = norm(v); return v==='white'||v==='#fff'||v==='#ffffff'||v.indexOf('rgba(255,255,255')===0; };
  svg.querySelectorAll('rect').forEach(function(r){ r.setAttribute('fill','#FFFFFF'); });
  svg.querySelectorAll('circle').forEach(function(c){
    var st = norm(c.getAttribute('stroke'));
    if(!st && isWhite(c.getAttribute('fill'))){ c.parentNode.removeChild(c); return; } // 背景の星
    if(st==='#c9a84c'){ c.setAttribute('stroke',PRINT_GOLD); c.setAttribute('stroke-width','0.75'); c.setAttribute('opacity','1'); return; }
    if(st==='#ffd700'){ c.setAttribute('stroke','#C08A00'); c.setAttribute('stroke-width','2.8'); return; }
    if(isWhite(st)){
      var w = parseFloat(c.getAttribute('stroke-width')||'1');
      c.setAttribute('stroke',PRINT_GOLD); c.setAttribute('stroke-width', String(+(w>=2 ? w : w+0.3).toFixed(1)));
      c.setAttribute('opacity','1');
    }
  });
  svg.querySelectorAll('line').forEach(function(l){ l.setAttribute('stroke',PRINT_GOLD); l.setAttribute('stroke-width','0.75'); });
  return box.innerHTML;
}

// ===== PDF保存・印刷（ネイビー／白 背景選択） =====
function savePDF(theme){
  const chart=$('celestial-chart');
  if(!chart._navy) chart._navy=chart.innerHTML;
  if(theme==='white'){ chart.innerHTML=whitenChartSvg(chart._navy); document.documentElement.classList.add('print-white'); }
  else { chart.innerHTML=chart._navy; document.documentElement.classList.remove('print-white'); }
  window.print();
}
window.addEventListener('afterprint',()=>{
  const chart=$('celestial-chart');
  if(chart._navy){ chart.innerHTML=chart._navy; chart._navy=null; }
  document.documentElement.classList.remove('print-white');
});
